name: Deploy BBMB App to Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore
        working-directory: BBMB.Services/BBMB.BudgetService
        run: dotnet restore

      - name: Build
        working-directory: BBMB.Services/BBMB.BudgetService
        run: dotnet build -c Release --no-restore

      - name: Publish
        working-directory: BBMB.Services/BBMB.BudgetService
        run: dotnet publish -c Release -o publish

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "BBMB.Services/BBMB.BudgetService/publish/*"
          target: "/home/ubuntu/bbmb-app"
          strip_components: 1
          timeout: 60s

      - name: Apply Staging config and restart service
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
      
          ssh -tt -o StrictHostKeyChecking=no \
              -i key.pem \
              ubuntu@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
      
            echo "Switching to app directory"
            cd /home/ubuntu/bbmb-app
      
            echo "Applying Staging configuration"
            cp appsettings.Staging.json appsettings.json
      
            echo "Reloading systemd"
            sudo systemctl daemon-reload
      
            echo "Restarting service"
            sudo systemctl restart bbmb-budget-service.service
      
            echo "Service status:"
            sudo systemctl status bbmb-budget-service.service --no-pager
          EOF

