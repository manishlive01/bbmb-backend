name: BBMB_stag_deploy

on:
  push:
    branches:
      - deploy_stag

jobs:
  build-and-deploy:
    runs-on: [self-hosted, bbmb-stg]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Runner
        run: |
          echo "Running on:"
          hostname
          echo "Current user:"
          whoami

      - name: Check .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Restore Dependencies
        run: dotnet restore BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj

      - name: Build Application
        run: dotnet build BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj --no-restore --configuration Release

      - name: Publish Application
        run: dotnet publish BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj --configuration Release --no-build --output ./publish

      - name: Deploy Application
        run: |
          echo "Stopping application..."
          sudo systemctl stop bbmb-api.service

          echo "Removing old deployment..."
          sudo rm -rf /var/www/bbmb-api/*

          echo "Copying new build..."
          sudo cp -r ./publish/* /var/www/bbmb-api/

          echo "Setting ownership..."
          sudo chown -R nginx:nginx /var/www/bbmb-api/

          echo "Starting application..."
          sudo systemctl start bbmb-api.service

          echo "Checking service status..."
          sudo systemctl status bbmb-api.service --no-pager
