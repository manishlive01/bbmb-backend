name: BBMB_stag_deploy

on:
  push:
    branches:
      - deploy_stag

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbmb-staging-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy BBMB API
    runs-on: [self-hosted, Linux, X64, BBMB-STG-app]
    timeout-minutes: 30

    env:
      PROJECT_PATH: BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj
      DEPLOY_DIR: /var/www/bbmb-api
      SERVICE_NAME: bbmb-api.service

    steps:
      # 1. Verify correct server before proceeding
      - name: Verify Deployment Server
        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"

          if [ "$(hostname)" != "BBMB-STG-app" ]; then
            echo "ERROR: Wrong deployment server."
            exit 1
          fi

      # 2. Verify installed .NET SDK
      - name: Verify .NET SDK
        run: |
          export DOTNET_ROOT=/usr/lib64/dotnet
          export PATH="$DOTNET_ROOT:$DOTNET_ROOT/tools:$PATH"

          dotnet --list-sdks
          dotnet --version

          dotnet --version | grep -q '^10\.' || {
            echo "ERROR: .NET 10 SDK is not available."
            exit 1
          }

      # 3. Checkout source
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: deploy_stag
          submodules: false
          clean: false

      # 4. Check project exists
      - name: Verify Project
        run: |
          if [ ! -f "$PROJECT_PATH" ]; then
            echo "ERROR: Project file not found: $PROJECT_PATH"
            exit 1
          fi

      # 5. Restore packages
      - name: Restore
        run: |
          export DOTNET_ROOT=/usr/lib64/dotnet
          export PATH="$DOTNET_ROOT:$PATH"

          dotnet restore "$PROJECT_PATH"

      # 6. Build project
      - name: Build
        run: |
          export DOTNET_ROOT=/usr/lib64/dotnet
          export PATH="$DOTNET_ROOT:$PATH"

          dotnet build "$PROJECT_PATH" \
            --configuration Release \
            --no-restore

      # 7. Publish application
      - name: Publish
        run: |
          export DOTNET_ROOT=/usr/lib64/dotnet
          export PATH="$DOTNET_ROOT:$PATH"

          dotnet publish "$PROJECT_PATH" \
            --configuration Release \
            --no-build \
            --output "$RUNNER_TEMP/bbmb-api-publish"

      # 8. Verify publish output
      - name: Verify Publish Output
        run: |
          if [ ! -f "$RUNNER_TEMP/bbmb-api-publish/BBMB.BudgetService.dll" ]; then
            echo "ERROR: Published application DLL not found."
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/bbmb-api-publish"

      # 9. Check deployment directory and service
      - name: Verify Deployment Target
        run: |
          if [ "$(hostname)" != "BBMB-STG-app" ]; then
            echo "ERROR: Wrong server. Deployment aborted."
            exit 1
          fi

          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "ERROR: Deployment directory not found: $DEPLOY_DIR"
            exit 1
          fi

          systemctl is-active "$SERVICE_NAME"

      # 10. Backup existing application
      - name: Backup Existing Application
        run: |
          BACKUP_DIR="/var/www/bbmb-api-backups"
          TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
          BACKUP_PATH="$BACKUP_DIR/bbmb-api-$TIMESTAMP.tar.gz"

          mkdir -p "$BACKUP_DIR"

          tar -czf "$BACKUP_PATH" \
            -C "$DEPLOY_DIR" .

          echo "Backup created: $BACKUP_PATH"

      # 11. Deploy published files
      - name: Deploy Application
        run: |
          set -euo pipefail

          if [ "$(hostname)" != "BBMB-STG-app" ]; then
            echo "ERROR: Wrong server. Deployment aborted."
            exit 1
          fi

          PUBLISH_DIR="$RUNNER_TEMP/bbmb-api-publish"

          systemctl stop "$SERVICE_NAME"

          cp -a "$PUBLISH_DIR/." "$DEPLOY_DIR/"

          chown -R nginx:nginx "$DEPLOY_DIR"

          systemctl start "$SERVICE_NAME"

          sleep 5

          systemctl is-active --quiet "$SERVICE_NAME"

          echo "Deployment completed successfully."

      # 12. Show service status
      - name: Verify Application
        if: always()
        run: |
          echo "Hostname: $(hostname)"
          systemctl status "$SERVICE_NAME" --no-pager || true
