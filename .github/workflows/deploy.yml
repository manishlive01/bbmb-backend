name: Deploy BBMB App to Ubuntu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: BBMB.Services/BBMB.BudgetService
        run: dotnet restore

      - name: Build
        working-directory: BBMB.Services/BBMB.BudgetService
        run: dotnet build -c Release --no-restore

      - name: Publish
        working-directory: BBMB.Services/BBMB.BudgetService
        run: dotnet publish -c Release -o publish

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "BBMB.Services/BBMB.BudgetService/publish/*"
          target: "/home/ubuntu/bbmb-app"
          strip_components: 1

      - name: Apply Staging config and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/bbmb-app

            echo "Applying Staging configuration..."
            cp appsettings.Staging.json appsettings.json

            echo "Restarting service..."
            sudo systemctl restart bbmb-budget-service
            sudo systemctl is-active bbmb-budget-service
