name: BBMB_stag_deploy

on:
  push:
    branches:
      - deploy_stag

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      # Step 1: Verify runner and target server
      - name: Verify Runner
        run: |
          echo "Hostname:"
          hostname

          echo "User:"
          whoami

          echo "API Service Status:"
          systemctl status bbmb-api.service --no-pager || true

          echo "Deployment Directory:"
          ls -ld /var/www/bbmb-api || true

      # Step 2: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 3: Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 4: Restore dependencies
      - name: Restore Dependencies
        run: |
          dotnet restore BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj

      # Step 5: Build application
      - name: Build Application
        run: |
          dotnet build BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj \
            --configuration Release \
            --no-restore

      # Step 6: Publish application
      - name: Publish Application
        run: |
          dotnet publish BBMB.Services/BBMB.BudgetService/BBMB.BudgetService.csproj \
            --configuration Release \
            --no-build \
            --output "${{ github.workspace }}/publish"

      # Step 7: Verify published files
      - name: Verify Published Files
        run: |
          test -f "${{ github.workspace }}/publish/BBMB.BudgetService.dll"
          ls -lh "${{ github.workspace }}/publish"

      # Step 8: Deploy application
      - name: Deploy to BBMB Staging
        run: |
          set -e

          echo "Checking target server..."
          HOSTNAME=$(hostname)
          echo "Current server: $HOSTNAME"

          if [ "$HOSTNAME" != "BBMB-STG-app" ]; then
            echo "ERROR: Deployment stopped. This is not BBMB-STG-app."
            exit 1
          fi

          echo "Checking API service..."
          systemctl is-active bbmb-api.service

          echo "Creating deployment backup..."
          BACKUP_DIR="/var/www/bbmb-api-backup-$(date +%Y%m%d-%H%M%S)"
          sudo mkdir -p "$BACKUP_DIR"
          sudo cp -a /var/www/bbmb-api/. "$BACKUP_DIR/"

          echo "Stopping API service..."
          sudo systemctl stop bbmb-api.service

          echo "Copying published files..."
          sudo cp -a "${{ github.workspace }}/publish/." /var/www/bbmb-api/

          echo "Setting ownership..."
          sudo chown -R nginx:nginx /var/www/bbmb-api

          echo "Starting API service..."
          sudo systemctl start bbmb-api.service

          echo "Waiting for service startup..."
          sleep 5

          echo "Checking API service status..."
          sudo systemctl is-active --quiet bbmb-api.service

          echo "Deployment completed successfully."
          sudo systemctl status bbmb-api.service --no-pager
